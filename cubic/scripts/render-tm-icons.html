<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:240px;height:40px;background:#141A28;overflow:hidden}
body{display:flex}
.cell{width:40px;height:40px;display:grid;place-items:center}
.mark{width:20px;height:20px;background:#E8ECF5;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
</style></head>
<body>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/codex.svg');mask-image:url('../design-preview/icons/codex.svg')"></div></div>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/cursor.svg');mask-image:url('../design-preview/icons/cursor.svg')"></div></div>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/workbuddy.svg');mask-image:url('../design-preview/icons/workbuddy.svg')"></div></div>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/kimi.svg');mask-image:url('../design-preview/icons/kimi.svg')"></div></div>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/claude.svg');mask-image:url('../design-preview/icons/claude.svg')"></div></div>
<div class="cell"><div class="mark" style="-webkit-mask-image:url('../design-preview/icons/grok.svg');mask-image:url('../design-preview/icons/grok.svg')"></div></div>
</body></html>
