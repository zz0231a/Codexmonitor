<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Monitor 设置</title>
<style>
  :root {
    --crt-bg: #040805;
    --crt-panel: #071009;
    --phosphor: #4dff88;
    --phosphor-hi: #a6ffc4;
    --phosphor-dim: #2f7a4c;
    --phosphor-faint: #1a3d28;
    --amber: #ffb000;
    --err: #ff5f56;
    --text: #c9e8d2;
    --dim: #5e8a6d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--crt-bg);
    color: var(--text);
    font-family: "Cascadia Mono", "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
    margin: 0;
    padding: 24px 16px 40px;
    line-height: 1.5;
  }
  /* CRT 扫描线 + 暗角 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    pointer-events: none; z-index: 90;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events: none; z-index: 91;
  }
  .term { max-width: 460px; margin: 0 auto; position: relative; z-index: 1; }

  .header { margin-bottom: 14px; }
  .title {
    font-size: 20px; letter-spacing: 3px; margin: 0 0 4px;
    color: var(--phosphor);
    text-shadow: 0 0 6px rgba(77,255,136,.55), 0 0 18px rgba(77,255,136,.25);
    font-weight: 700;
  }
  .cursor {
    display: inline-block; width: 9px; height: 15px; margin-left: 6px;
    background: var(--phosphor); vertical-align: -2px;
    box-shadow: 0 0 8px rgba(77,255,136,.7);
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .cmdline { font-size: 11px; color: var(--dim); }
  .cmdline .prompt { color: var(--phosphor-dim); }

  .panel {
    background: var(--crt-panel);
    border: 1px solid var(--phosphor-faint);
    border-radius: 2px;
    padding: 18px 16px 16px;
    position: relative;
    box-shadow: inset 0 0 24px rgba(77,255,136,.04);
  }
  .panel-tag {
    position: absolute; top: -9px; left: 12px;
    background: var(--crt-bg); padding: 0 8px;
    font-size: 11px; letter-spacing: 2px; color: var(--phosphor-dim);
  }

  label {
    display: block; font-size: 11px; letter-spacing: 1px;
    color: var(--dim); margin: 14px 0 4px;
  }
  label::before { content: "> "; color: var(--phosphor-dim); }
  label:first-of-type { margin-top: 2px; }
  input {
    width: 100%;
    background: #050c07;
    border: 1px solid var(--phosphor-faint);
    border-radius: 2px;
    color: var(--phosphor-hi);
    padding: 8px 10px;
    font-family: inherit; font-size: 13px;
    letter-spacing: 1px;
    caret-color: var(--phosphor);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--phosphor-faint); }
  input:focus {
    border-color: var(--phosphor-dim);
    box-shadow: 0 0 0 1px rgba(77,255,136,.25), 0 0 12px rgba(77,255,136,.12);
  }

  .row { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--phosphor-dim);
    border-radius: 2px;
    color: var(--phosphor);
    padding: 10px 8px;
    font-family: inherit; font-size: 12px; letter-spacing: 2px;
    cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  button::before { content: "[ "; color: var(--phosphor-dim); }
  button::after { content: " ]"; color: var(--phosphor-dim); }
  button:hover, button:focus-visible {
    background: var(--phosphor);
    color: #031007;
    box-shadow: 0 0 14px rgba(77,255,136,.35);
    outline: none;
  }
  button:hover::before, button:hover::after,
  button:focus-visible::before, button:focus-visible::after { color: #031007; }
  button:active { transform: translateY(1px); }
  button.primary { border-color: var(--phosphor); }

  #result {
    margin-top: 18px;
    background: #050c07;
    border: 1px solid var(--phosphor-faint);
    border-radius: 2px;
    padding: 10px 12px;
    font-size: 12px;
    white-space: pre-wrap;
    min-height: 20px;
    color: var(--dim);
  }
  #result:empty { display: none; }
  #result::before { content: "$ "; color: var(--phosphor-dim); }
  #result.ok { color: var(--phosphor); border-color: var(--phosphor-faint); }
  #result.warn { color: var(--amber); border-color: rgba(255,176,0,.35); }
  #result.err { color: var(--err); border-color: rgba(255,95,86,.4); }

  p.note { font-size: 11px; color: var(--dim); line-height: 1.7; margin: 14px 2px 0; }
  p.note code { color: var(--phosphor-dim); }

  .footer {
    margin-top: 22px; font-size: 10px; letter-spacing: 2px;
    color: var(--phosphor-faint); text-align: center;
  }
</style>
</head>
<body>
  <div class="term">
    <div class="header">
      <h1 class="title">[ CODEX MONITOR ]<span class="cursor"></span></h1>
      <div class="cmdline"><span class="prompt">codex@monitor:~$</span> ./setup --bridge --tty</div>
    </div>
    <div class="panel">
      <span class="panel-tag">┤ BRIDGE CONFIG ├</span>
      <label for="host">桥接程序 IP（Windows 电脑局域网地址）</label>
      <input id="host" type="text" placeholder="例如 192.168.1.10" autocomplete="off">
      <label for="port">端口</label>
      <input id="port" type="text" inputmode="numeric" placeholder="8973" autocomplete="off">
      <label for="label">设备备注（可选）</label>
      <input id="label" type="text" placeholder="副屏" autocomplete="off">
      <div class="row">
        <button id="save" class="primary">保存</button>
        <button id="test">测试连接</button>
      </div>
      <div id="result"></div>
      <p class="note">连接测试只读取 <code>/api/v1/health</code>，显示 Bridge / Codex / Hook / JSONL 与最后更新时间。配置保存在本应用目录，不修改系统天气设置。</p>
    </div>
    <div class="footer">CODEX MONITOR v0.5.0 · DASHBOARD</div>
  </div>
<script>
"use strict";
var CONFIG_PATH = "/sd/apps/codex_monitor/config.json";

function writeConfigFile(text) {
  return fetch("/api/system/fs/upload?path=" + encodeURIComponent(CONFIG_PATH), {
    method: "PUT",
    headers: { "Content-Type": "application/json; charset=utf-8" },
    body: text,
    cache: "no-store"
  }).then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
  });
}

function readConfigFile() {
  return fetch("/api/system/fs/file?path=" + encodeURIComponent(CONFIG_PATH), { cache: "no-store" })
    .then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    });
}

function show(text, cls) {
  var el = document.getElementById("result");
  el.textContent = text;
  el.className = cls || "";
}

function validHost(host) {
  if (!host) return false;
  if (/[\s/?#\u0000-\u001f]/.test(host)) return false;
  if (/^\d+\.\d+\.\d+\.\d+$/.test(host)) {
    return host.split(".").every(function (part) {
      var n = Number(part);
      return n >= 0 && n <= 255;
    });
  }
  return /^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$/.test(host) || /^[A-Za-z0-9]$/.test(host);
}

function validPort(port) {
  return Number.isInteger(port) && port >= 1 && port <= 65535;
}

function currentConfig() {
  return {
    host: document.getElementById("host").value.trim(),
    port: Number(document.getElementById("port").value.trim() || "8973"),
    label: document.getElementById("label").value.trim()
  };
}

function validateConfig(cfg) {
  if (!cfg.host) return "请先填写桥接程序 IP";
  if (!validHost(cfg.host)) return "主机地址无效";
  if (!validPort(cfg.port)) return "端口必须是 1 到 65535 的整数";
  return "";
}

document.getElementById("save").addEventListener("click", function () {
  var cfg = currentConfig();
  var error = validateConfig(cfg);
  if (error) { show(error, "err"); return; }
  writeConfigFile(JSON.stringify(cfg)).then(function () {
    show("已保存到 " + CONFIG_PATH, "ok");
  }).catch(function (err) {
    show("保存失败：" + err.message, "err");
  });
});

document.getElementById("test").addEventListener("click", function () {
  var cfg = currentConfig();
  var error = validateConfig(cfg);
  if (error) { show(error, "err"); return; }
  show("测试中…");
  fetch("http://" + cfg.host + ":" + cfg.port + "/api/v1/health", { cache: "no-store" })
    .then(function (res) { return res.json().then(function (body) { return { code: res.status, body: body }; }); })
    .then(function (r) {
      var sources = r.body.sources || {};
      var hook = sources.hook || {};
      var jsonl = sources.jsonl || {};
      var lines = [
        "Bridge：" + (r.body.bridge || "--"),
        "Codex：" + (r.body.codex_connected ? "正常" : "断开"),
        "Hook：" + (hook.connected ? "已连接" : "未连接"),
        "JSONL：" + (jsonl.available ? "可用" : "不可用"),
        "最后更新：" + (r.body.last_updated_at || 0)
      ];
      show(lines.join("\n") + (r.code === 200 ? "" : "\n(HTTP " + r.code + ")"), r.code === 200 ? "ok" : "warn");
    })
    .catch(function () { show("无法连接桥接程序，请检查 IP、端口与网络", "err"); });
});

readConfigFile().then(function (raw) {
  if (!raw) return;
  try {
    var cfg = JSON.parse(raw);
    if (cfg.host) document.getElementById("host").value = cfg.host;
    if (cfg.port) document.getElementById("port").value = String(cfg.port);
    if (cfg.label) document.getElementById("label").value = cfg.label;
    show("已载入现有配置", "ok");
  } catch (e) { show("配置文件解析失败，将使用默认值", "warn"); }
}).catch(function () {});
</script>
</body>
</html>
