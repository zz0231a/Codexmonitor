<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Token Monitor 第 3 页 · Claude 超过 Kimi 后</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:320px;height:240px;overflow:hidden;background:#0A0E17}
body{font-family:"Segoe UI",Montserrat,sans-serif;color:#D5DBE5}
.card{background:#141A28;border:1px solid #222A3A;border-radius:7px}
.ht{position:absolute;left:8px;top:8px;font-size:14px;font-weight:800;letter-spacing:2px;color:#E8ECF5}
.live{position:absolute;left:118px;top:12px;display:flex;align-items:center;gap:5px;font-size:8px;letter-spacing:1px;color:#8A93A6}
.live .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 5px rgba(74,222,128,.9)}
.live b{color:#4ADE80;font-weight:700}
.hh{position:absolute;right:8px;top:12px;font-size:8px;letter-spacing:1px;color:#8A93A6;font-weight:600}
.board{position:absolute;left:8px;top:32px;width:304px;height:128px}
.cell{position:absolute;top:0;width:76px;height:128px}
.rank{position:absolute;left:6px;top:4px;font-size:8px;font-weight:700;color:#5A6376}
.ring{position:absolute;left:10px;top:14px;width:56px;height:56px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg);overflow:visible}
.mark{width:20px;height:20px;background:#E8ECF5;z-index:1;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.pct{position:absolute;left:0;top:74px;width:76px;text-align:center;font-size:12px;font-weight:700;color:#E8ECF5}
.pct.dim{color:#6B7484}
.name{position:absolute;left:0;top:92px;width:76px;text-align:center;font-size:8px;letter-spacing:1px;color:#8A93A6;font-weight:600}
.win{position:absolute;left:0;top:106px;width:76px;text-align:center;font-size:8px;color:#5A6376;letter-spacing:.5px}
.stats{position:absolute;left:8px;top:166px;width:304px;height:66px;display:flex}
.col{flex:1;padding:8px 0 0;text-align:center;border-right:1px solid #222A3A}
.col:last-child{border-right:none}
.sl{font-size:8px;letter-spacing:1px;color:#8A93A6;font-weight:600}
.sv{margin-top:5px;font-size:13px;font-weight:800;color:#E8ECF5}
.sc{margin-top:2px;font-size:8px;color:#8A93A6}
</style>
</head>
<body>
<div class="ht">TOKENS</div>
<div class="live"><span class="dot"></span><b>LIVE</b></div>
<div class="hh">TOP 4</div>
<div class="board card">
  <div class="cell" style="left:0">
    <div class="rank">1</div>
    <div class="ring">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="19" fill="none" stroke="rgba(73,163,176,.22)" stroke-width="3.5"/>
        <circle cx="21" cy="21" r="19" fill="none" stroke="#49a3b0" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="119.38" stroke-dashoffset="21.49"/>
      </svg>
      <div class="mark" style="-webkit-mask-image:url(icons/codex.svg);mask-image:url(icons/codex.svg)"></div>
    </div>
    <div class="pct">82%</div>
    <div class="name">CODEX</div>
    <div class="win">5H LEFT</div>
  </div>
  <div class="cell" style="left:76px">
    <div class="rank">2</div>
    <div class="ring">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="19" fill="none" stroke="rgba(232,236,245,.14)" stroke-width="3.5"/>
        <circle cx="21" cy="21" r="19" fill="none" stroke="#E8ECF5" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="119.38" stroke-dashoffset="17.91"/>
      </svg>
      <div class="mark" style="-webkit-mask-image:url(icons/cursor.svg);mask-image:url(icons/cursor.svg)"></div>
    </div>
    <div class="pct">85%</div>
    <div class="name">CURSOR</div>
    <div class="win">WKLY LEFT</div>
  </div>
  <div class="cell" style="left:152px">
    <div class="rank">3</div>
    <div class="ring">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="19" fill="none" stroke="rgba(13,200,165,.18)" stroke-width="3.5"/>
      </svg>
      <div class="mark" style="-webkit-mask-image:url(icons/workbuddy.svg);mask-image:url(icons/workbuddy.svg)"></div>
    </div>
    <div class="pct dim">--</div>
    <div class="name">WBUDDY</div>
    <div class="win">NO RST</div>
  </div>
  <div class="cell" style="left:228px">
    <div class="rank">4</div>
    <div class="ring">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="19" fill="none" stroke="rgba(204,124,94,.22)" stroke-width="3.5"/>
      </svg>
      <div class="mark" style="-webkit-mask-image:url(icons/claude.svg);mask-image:url(icons/claude.svg)"></div>
    </div>
    <div class="pct dim">--</div>
    <div class="name">CLAUDE</div>
    <div class="win">NO RST</div>
  </div>
</div>
<div class="stats card">
  <div class="col"><div class="sl">RATE</div><div class="sv">2.4K/m</div><div class="sc">BURN</div></div>
  <div class="col"><div class="sl">TODAY</div><div class="sv">12.9M</div><div class="sc">$13.70</div></div>
  <div class="col"><div class="sl">7D</div><div class="sv">166M</div><div class="sc">$152</div></div>
  <div class="col"><div class="sl">ALL</div><div class="sv">2.2B</div><div class="sc">$1219</div></div>
</div>
</body>
</html>
